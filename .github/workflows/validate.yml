name: Validate Boundless baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifest and static dependency graph
        run: python -m scripts.validate_manifest --static
      - name: Test repository scripts
        run: python -m unittest discover -s tests -v
